name: Release Integration

on:
  push:
    tags:
      - 'integrations/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Extract integration info
      id: info
      run: |
        # refs/tags/integrations/codex/v0.1.0 → integration=codex, version=0.1.0
        TAG="${GITHUB_REF#refs/tags/}"
        INTEGRATION=$(echo "$TAG" | cut -d'/' -f2)
        VERSION=$(echo "$TAG" | cut -d'/' -f3 | sed 's/^v//')
        echo "integration=$INTEGRATION" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Integration: $INTEGRATION, Version: $VERSION"

    - name: Validate Codex integration tag
      run: |
        if [ "${{ steps.info.outputs.integration }}" != "codex" ]; then
          echo "Only the codex integration can be released from hindsight-lite."
          exit 1
        fi

    - name: Codex release
      run: |
        echo "Codex integration ${{ steps.info.outputs.version }} has no package artifact to publish."
