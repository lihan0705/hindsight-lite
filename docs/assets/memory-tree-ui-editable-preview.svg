<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">Demo memory tree reflection review walkthrough</title>
  <desc id="desc">A contact-sheet preview of the hindsight-lite memory tree showing editable pages, retained sessions, and linked reflection request/result metadata for eval review.</desc>
  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .title { fill: #18201b; font-size: 26px; font-weight: 700; }
      .section { fill: #18201b; font-size: 18px; font-weight: 700; }
      .small { fill: #667065; font-size: 12px; }
      .body { fill: #18201b; font-size: 13px; }
      .code { fill: #18201b; font-size: 12px; }
      .muted-code { fill: #667065; font-size: 11px; }
      .panel { fill: #ffffff; stroke: #d9ded2; }
      .soft { fill: #fbfbf7; stroke: #d9ded2; }
      .active { fill: #eef3e9; }
      .page { fill: #1f7a4c; }
      .session { fill: #245f9f; }
      .reflection { fill: #6848a8; }
      .result { fill: #9b6b12; }
      .index { fill: #9b6b12; }
    </style>
  </defs>

  <rect width="1440" height="1040" fill="#f7f7f3"/>
  <text x="44" y="58" class="ui title">hindsight-lite demo memory tree</text>
  <text x="44" y="84" class="ui small">Generated by: python3 -m hindsight_lite demo-memory seed --bank codex --write-ui</text>

  <g transform="translate(44 112)">
    <rect width="284" height="884" rx="8" class="soft"/>
    <text x="24" y="36" class="ui section">codex</text>
    <text x="24" y="60" class="mono muted-code">~/.hindsight-lite/banks/codex</text>

    <g transform="translate(24 88)">
      <rect width="108" height="58" rx="8" class="panel"/>
      <text x="14" y="26" class="ui section">2</text>
      <text x="14" y="45" class="ui small">Pages</text>
      <rect x="124" width="108" height="58" rx="8" class="panel"/>
      <text x="138" y="26" class="ui section">2</text>
      <text x="138" y="45" class="ui small">Sessions</text>
      <rect y="72" width="108" height="58" rx="8" class="panel"/>
      <text x="14" y="98" class="ui section">2</text>
      <text x="14" y="117" class="ui small">Reflections</text>
      <rect x="124" y="72" width="108" height="58" rx="8" class="panel"/>
      <text x="138" y="98" class="ui section">1</text>
      <text x="138" y="117" class="ui small">Index</text>
    </g>

    <text x="24" y="258" class="ui small" font-weight="700">PAGES</text>
    <rect x="20" y="270" width="236" height="36" rx="8" class="active"/>
    <circle cx="36" cy="288" r="5" class="page"/>
    <text x="52" y="293" class="ui body">project-direction</text>
    <circle cx="36" cy="326" r="5" class="page"/>
    <text x="52" y="331" class="ui body">coding-preferences</text>

    <text x="24" y="382" class="ui small" font-weight="700">SESSIONS</text>
    <circle cx="36" cy="412" r="5" class="session"/>
    <text x="52" y="417" class="ui body">auth-redirect-loop.jsonl</text>
    <circle cx="36" cy="452" r="5" class="session"/>
    <text x="52" y="457" class="ui body">memory-ui-feedback.jsonl</text>

    <text x="24" y="512" class="ui small" font-weight="700">REFLECTIONS</text>
    <circle cx="36" cy="542" r="5" class="reflection"/>
    <text x="52" y="547" class="ui body">ui-review-reflection.json</text>
    <circle cx="36" cy="582" r="5" class="result"/>
    <text x="52" y="587" class="ui body">ui-review-result.json</text>

    <text x="24" y="646" class="ui small" font-weight="700">INDEX</text>
    <circle cx="36" cy="676" r="5" class="index"/>
    <text x="52" y="681" class="ui body">recall-cache.json</text>
  </g>

  <g transform="translate(356 112)">
    <rect width="490" height="424" rx="8" class="panel"/>
    <text x="24" y="38" class="ui section">Pages / project-direction</text>
    <text x="24" y="62" class="mono muted-code">pages/project-direction.md</text>
    <line x1="0" y1="82" x2="490" y2="82" stroke="#d9ded2"/>
    <g transform="translate(24 104)">
      <rect width="140" height="28" rx="14" class="panel"/>
      <text x="12" y="19" class="ui small">title: Project Direction</text>
      <rect x="154" width="188" height="28" rx="14" class="panel"/>
      <text x="166" y="19" class="ui small">tags: direction, architecture</text>
    </g>
    <line x1="0" y1="150" x2="490" y2="150" stroke="#d9ded2"/>
    <g transform="translate(24 170)">
      <rect width="148" height="34" rx="8" fill="#f8faf5" stroke="#d9ded2"/>
      <text x="14" y="23" class="ui body">Download Markdown</text>
      <rect x="160" width="118" height="34" rx="8" fill="#f8faf5" stroke="#d9ded2"/>
      <text x="176" y="23" class="ui body">Reset changes</text>
    </g>
    <rect x="0" y="224" width="490" height="200" fill="#fffefb"/>
    <text x="24" y="258" class="mono code">hindsight-lite is a local-first memory runtime</text>
    <text x="24" y="284" class="mono code">for coding agents.</text>
    <text x="24" y="326" class="mono code">The repo should stay small: no server,</text>
    <text x="24" y="352" class="mono code">no daemon, no database, and no clients.</text>
  </g>

  <g transform="translate(874 112)">
    <rect width="490" height="424" rx="8" class="panel"/>
    <text x="24" y="38" class="ui section">Sessions / auth redirect</text>
    <text x="24" y="62" class="mono muted-code">sessions/auth-redirect-loop.jsonl</text>
    <line x1="0" y1="82" x2="490" y2="82" stroke="#d9ded2"/>
    <g transform="translate(24 104)">
      <rect width="80" height="28" rx="14" class="panel"/>
      <text x="12" y="19" class="ui small">events: 2</text>
      <rect x="94" width="132" height="28" rx="14" class="panel"/>
      <text x="106" y="19" class="ui small">tags: debugging, auth</text>
    </g>
    <rect x="0" y="150" width="490" height="274" fill="#fffefb"/>
    <text x="24" y="186" class="mono code">{ "id": "demo-auth-redirect-loop-1",</text>
    <text x="24" y="212" class="mono code">  "content": "middleware ran before</text>
    <text x="24" y="238" class="mono code">  cookie refresh" }</text>
    <text x="24" y="292" class="mono code">{ "id": "demo-auth-redirect-loop-2",</text>
    <text x="24" y="318" class="mono code">  "content": "refresh session state</text>
    <text x="24" y="344" class="mono code">  before redirect checks" }</text>
  </g>

  <g transform="translate(356 572)">
    <rect width="490" height="424" rx="8" class="panel"/>
    <text x="24" y="38" class="ui section">Reflection Request / ui-review-reflection</text>
    <text x="24" y="62" class="mono muted-code">reflections/ui-review-reflection.json</text>
    <line x1="0" y1="82" x2="490" y2="82" stroke="#d9ded2"/>
    <g transform="translate(24 104)">
      <rect width="158" height="28" rx="14" class="panel"/>
      <text x="12" y="19" class="ui small">type: reflection_request</text>
      <rect x="172" width="180" height="28" rx="14" class="panel"/>
      <text x="184" y="19" class="ui small">result: ui-review-result</text>
    </g>
    <rect x="0" y="150" width="490" height="274" fill="#fffefb"/>
    <text x="24" y="186" class="mono code">{</text>
    <text x="24" y="212" class="mono code">  "query": "What should the memory tree</text>
    <text x="24" y="238" class="mono code">  UI make easier to evaluate?",</text>
    <text x="24" y="280" class="mono code">  "result_schema": {</text>
    <text x="24" y="306" class="mono code">    "result_type": "reflection_result",</text>
    <text x="24" y="332" class="mono code">    "fields": ["trajectory", "confidence"]</text>
    <text x="24" y="358" class="mono code">  }</text>
    <text x="24" y="384" class="mono code">}</text>
  </g>

  <g transform="translate(874 572)">
    <rect width="490" height="424" rx="8" class="panel"/>
    <text x="24" y="38" class="ui section">Reflection Result / ui-review-result</text>
    <text x="24" y="62" class="mono muted-code">reflections/ui-review-result.json</text>
    <line x1="0" y1="82" x2="490" y2="82" stroke="#d9ded2"/>
    <g transform="translate(24 104)">
      <rect width="206" height="28" rx="14" class="panel"/>
      <text x="12" y="19" class="ui small">request: ui-review-reflection</text>
      <rect x="220" width="108" height="28" rx="14" class="panel"/>
      <text x="232" y="19" class="ui small">confidence: 0.82</text>
    </g>
    <rect x="0" y="150" width="490" height="274" fill="#fffefb"/>
    <text x="24" y="186" class="mono code">{</text>
    <text x="24" y="212" class="mono code">  "type": "reflection_result",</text>
    <text x="24" y="238" class="mono code">  "trajectory": {</text>
    <text x="24" y="264" class="mono code">    "lesson": "Keep result confidence</text>
    <text x="24" y="290" class="mono code">    and lesson visible next to JSON."</text>
    <text x="24" y="316" class="mono code">  },</text>
    <text x="24" y="342" class="mono code">  "durable_facts": ["results are local"],</text>
    <text x="24" y="368" class="mono code">  "confidence": 0.82</text>
    <text x="24" y="394" class="mono code">}</text>
  </g>
</svg>
