    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#18201b">
      <text x="28" y="292">hindsight-lite is a local-first memory runtime for coding agents.</text>
      <text x="28" y="342">The repo should stay small: no server, no daemon, no database, and no generated clients.</text>
      <text x="28" y="392">Good contributions make memory easier to inspect, edit, recall, or evaluate.</text>
